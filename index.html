<!DOCTYPE html>
<!--
  PLURAL PRACTICE - standalone page (no build step, no npm).
  GOOGLE SHEETS SETUP: search this file for  SHEETS_WEB_APP_URL  and paste your
  Google Apps Script Web App URL there. Leave it empty to keep everything on-device.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plural Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#483A3A; --bg-deep:#382C2C;
  --lilac:#C4B3CB; --peach:#F5CE96;
  --paper:#F7F2F5; --paper-2:#EBE1EE; --line:#D6C9DA;
  --ink:#2A2020; --ink-soft:#5E5052;
  --good:#245C3A; --good-bg:#DCEDDF; --good-line:#7DB58F;
  --bad:#8A2F2B; --bad-bg:#F7DDDA; --bad-line:#D98B86;
  --focus:#6B4FA0;
  --display:'Bricolage Grotesque','PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.55}
button{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol{margin-top:0}
[tabindex="-1"]{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app-header :focus-visible,.tabs :focus-visible{outline-color:var(--peach)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.app-header{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 18px;background:var(--bg-deep);border-bottom:1px solid rgba(196,179,203,.28)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:32px;height:32px;flex:none}
.brand h1{margin:0;font:700 clamp(21px,5vw,26px)/1.1 var(--display);letter-spacing:-.01em;color:var(--paper)}
.opt-btn{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:12px;border:2px solid var(--lilac);background:transparent;color:var(--lilac);cursor:pointer}
.opt-btn:hover,.opt-btn[aria-expanded="true"]{background:var(--lilac);color:var(--ink)}
.menu{position:absolute;right:12px;top:calc(100% + 8px);width:min(270px,calc(100vw - 24px));background:var(--paper);color:var(--ink);border-radius:16px;padding:8px;box-shadow:0 14px 34px rgba(0,0,0,.4);z-index:30}
.mi{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:13px 14px;font-size:17px;font-weight:700;cursor:pointer;color:var(--ink)}
.mi:hover{background:var(--paper-2)}
.mi svg{transition:transform .15s}
.mi[aria-expanded="true"] svg{transform:rotate(180deg)}
.mi-sub{margin:0 0 4px 10px;padding-left:8px;border-left:3px solid var(--lilac)}
.mi-sub .mi{font-weight:400;padding:11px 12px}
.mi-sub .mi[aria-checked="true"]{font-weight:700;background:var(--paper-2)}
.chk{width:1.2em;display:inline-block;color:var(--good)}

/* layout */
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:66px;padding:8px 4px;border-radius:14px;border:2px solid rgba(196,179,203,.55);background:transparent;color:var(--lilac);font:700 clamp(12.5px,3.4vw,16px)/1.15 var(--body);text-align:center;cursor:pointer}
.tab svg{width:16px;height:16px;flex:none}
.tab:hover{background:rgba(196,179,203,.14)}
.tab.done svg{color:var(--peach)}
.tab[aria-current="page"]{background:var(--lilac);border-color:var(--lilac);color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--ink)}
.tab[aria-disabled="true"]{border-style:dashed;opacity:.6;cursor:not-allowed}
.tab[aria-disabled="true"]:hover{background:transparent}
.panel{margin-top:14px;background:var(--paper);color:var(--ink);border-radius:22px;padding:24px 18px 28px;min-height:460px}
/*@media(min-width:700px){.panel{padding:34px 40px 38px}}*/
@media(min-width:700px){.panel{padding:22px 32px 26px;min-height:0}}
.panel h2{font:700 clamp(22px,4.8vw,30px)/1.15 var(--display);letter-spacing:-.01em;margin:0 0 6px}
.lede{color:var(--ink-soft);margin:0 0 6px;max-width:60ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 22px;border-radius:14px;border:2px solid var(--bg);background:transparent;color:var(--ink);font:700 17px/1.1 var(--body);cursor:pointer;transition:background .15s,transform .1s,box-shadow .1s}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn-ghost:hover:not(:disabled){background:var(--paper-2)}
.btn-primary{background:var(--bg);color:var(--paper)}
.btn-primary:hover:not(:disabled){background:#5D4A4A}
.btn-cta{background:var(--peach);color:var(--ink);box-shadow:0 4px 0 var(--bg)}
.btn-cta:hover:not(:disabled){background:#F8D8A9}
.btn-cta:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--bg)}
.btn-sm{min-height:42px;padding:8px 16px;font-size:16px}
.actions{margin-top:26px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.actions .hint{margin:0;color:var(--ink-soft);font-size:15px}

/* section 1 */
.rule-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:16px 0 22px}
.rule-btn{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 12px 8px 8px;min-height:50px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:15.5px;line-height:1.2;cursor:pointer}
.rule-btn:hover{border-color:var(--lilac);background:#FBF7FC}
.rule-btn .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;font:700 15px var(--display)}
.rule-btn.seen .n{background:var(--lilac)}
.rule-btn[aria-current="true"]{background:var(--bg);border-color:var(--bg);color:var(--paper)}
.rule-btn[aria-current="true"] .n{background:var(--peach);color:var(--ink)}
.rule-card h3{font:700 clamp(20px,4vw,25px)/1.2 var(--display);margin:0 0 10px;max-width:34ch}
.rule-card p{margin:0 0 14px;max-width:62ch}
.stage{background:var(--bg);color:var(--paper);border-radius:18px;padding:18px 18px 22px;margin:4px 0 18px}
.stage-label{display:block;color:var(--lilac);font-size:15px;margin-bottom:6px}
.stage-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 18px}
.word{font:600 clamp(34px,9.5vw,56px)/1.1 var(--display);letter-spacing:-.01em}
.word .add{display:inline-block;background:var(--peach);color:var(--ink);border-radius:8px;padding:0 .12em;margin-left:.04em}
.word .drop{background:rgba(196,179,203,.28);color:var(--lilac);text-decoration:line-through;text-decoration-thickness:.07em;border-radius:8px;padding:0 .08em}
.arrow{width:clamp(28px,6vw,44px);flex:none;color:var(--lilac)}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px 18px;padding-top:4px}
.pair{display:flex;align-items:center;gap:8px;min-width:0;font:600 clamp(17px,4.4vw,21px)/1.2 var(--display)}
.pair span{min-width:0;overflow-wrap:anywhere}
.pair .arrow{width:20px;flex:none}
.pair .p{color:var(--peach)}
.note{display:flex;gap:12px;align-items:flex-start;background:#FCEFD9;border:1px solid #E8C88F;border-radius:14px;padding:12px 16px;margin:0 0 14px}
.note p{margin:0}

/* progress */
.progress{margin:18px 0 20px}
.progress-top{display:flex;justify-content:space-between;gap:12px;font-weight:700;margin-bottom:8px}
.segs{display:flex;align-items:center;gap:4px}
.seg{flex:1;height:8px;border-radius:4px;background:var(--line)}
.seg.ok{background:#4E9A6B}.seg.no{background:#C9605A}
.seg.cur{height:14px;background:var(--bg)}
.seg.cur.ok{background:#4E9A6B}.seg.cur.no{background:#C9605A}
.seg.cur{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--bg)}

/* quiz */
.opts{display:grid;gap:10px;margin:0 0 18px}
@media(min-width:700px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;min-height:60px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:clamp(19px,4.6vw,22px);line-height:1.2;cursor:pointer;flex-wrap:wrap}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;font:700 16px var(--display)}
.opt .tag{margin-left:auto;font-size:14px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--lilac);background:#FBF7FC}
.opt[aria-checked="true"]{border-color:var(--bg);background:var(--paper-2)}
.opt[aria-checked="true"] .k{background:var(--bg);color:var(--paper)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.right{border-color:var(--good-line);background:var(--good-bg);color:var(--good)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.fb{border-radius:14px;padding:14px 16px 12px;margin-bottom:18px;border:2px solid}
.fb.good{background:var(--good-bg);border-color:var(--good-line)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.fb .title{display:block;font:700 21px/1.2 var(--display);margin-bottom:4px}
.fb.good .title{color:var(--good)}.fb.bad .title{color:var(--bad)}
.fb p{margin:4px 0;color:var(--ink)}
.fb .eq{font-size:19px}
.rule-line{margin:6px 0 0;color:var(--ink);font-size:16px}
.rule-num{display:inline-block;background:var(--bg);color:var(--paper);border-radius:999px;padding:1px 11px;margin-right:8px;font-weight:700;font-size:14px;white-space:nowrap}
.note-line{font-size:16px;color:var(--ink-soft)!important}
.nav{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"check check" "prev next";gap:10px}
.nav .btn{width:100%}
.nav .prev{grid-area:prev}.nav .check{grid-area:check}.nav .next{grid-area:next}
@media(min-width:700px){
  .nav{grid-template-columns:1fr auto 1fr;grid-template-areas:"prev check next"}
  .nav .btn{width:auto}
  .nav .prev{justify-self:start}.nav .next{justify-self:end}
}
.ask{margin:4px 0 16px}
.ask .stage{margin:0}
.ask .stage-row{padding:6px 0 4px}
.ans{width:100%;font:600 clamp(22px,5.5vw,28px)/1.2 var(--display);padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);margin-bottom:16px}
.ans:focus{border-color:var(--bg)}
.ans.ok{border-color:var(--good-line);background:var(--good-bg)}
.ans.no{border-color:var(--bad-line);background:var(--bad-bg)}
.ans::placeholder{color:#9A8C9C;font-weight:400}

/* overview */
.score{font:700 clamp(22px,5vw,28px)/1.2 var(--display);margin:10px 0 0}
.ov-list{list-style:none;padding:0;margin:16px 0 4px;display:grid;gap:12px}
.ov-item{border:2px solid var(--line);border-radius:16px;padding:14px 16px 12px;background:#fff}
.ov-item.ok{border-color:var(--good-line)}.ov-item.no{border-color:var(--bad-line)}
.ov-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font:700 19px var(--display)}
.badge{font:700 14px var(--body);padding:3px 11px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--good-bg);color:var(--good)}.badge.no{background:var(--bad-bg);color:var(--bad)}
.ov-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.ov-opt{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:7px 10px;border-radius:10px;background:var(--paper);font-size:17px}
.ov-opt small{font-size:13px;font-weight:700}
.ov-opt.right{background:var(--good-bg);color:var(--good);font-weight:700}
.ov-opt.wrong{background:var(--bad-bg);color:var(--bad);font-weight:700}
.ov-line{margin:0 0 4px}

/* results */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{background:var(--paper-2);border-radius:999px;padding:5px 14px;font-weight:700;font-size:15.5px}
.chart{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 16px 14px;margin:20px 0 24px}
.chart h3{font:700 21px/1.2 var(--display);margin:0 0 10px}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:15.5px;margin:0 0 16px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;border:2px solid var(--bg);vertical-align:-3px;margin-right:7px}
.crow{display:grid;grid-template-columns:minmax(78px,112px) minmax(0,1fr) 1.6em;align-items:center;gap:10px;margin-bottom:14px}
.clabel{line-height:1.15}
.clabel b{display:block;font-size:16px}
.clabel span{font-size:13px;color:var(--ink-soft)}
.cbar{display:flex;height:30px;border:2px solid var(--bg);border-radius:6px;overflow:hidden;background:#fff}
.cseg{flex:1;border-right:2px solid var(--bg)}
.cseg:last-child{border-right:0}
.cseg.s2{background:var(--lilac)}.cseg.s3{background:var(--peach)}.cseg.s0{background:#fff}
.ctotal{font:700 22px var(--display);text-align:right}
.cnote{margin:6px 0 0;font-size:14.5px;color:var(--ink-soft)}
.weak-title{font:700 clamp(20px,4vw,24px)/1.2 var(--display);margin:0 0 12px}
.weak{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:10px}
.weak-item{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.weak-item b{display:block}
.weak-item span{color:var(--ink-soft);font-size:15.5px}
.perfect{background:var(--good-bg);color:var(--good);border-radius:14px;padding:14px 16px;font-weight:700;margin:0 0 24px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(28,20,20,.74);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--paper);color:var(--ink);border-radius:24px;max-width:520px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:22px 22px 24px}
.modal.enter{animation:pop .28s cubic-bezier(.2,.8,.2,1)}
.modal .stage{display:flex;align-items:center;justify-content:center;gap:16px;padding:18px 16px;margin:0 0 18px}
.modal .word{font-size:clamp(34px,9vw,46px)}
.modal.enter .add{animation:chip .5s .45s both cubic-bezier(.2,.8,.2,1)}
.modal h2{font:700 clamp(24px,6vw,30px)/1.15 var(--display);margin:0 0 10px}
.modal p{margin:0 0 12px}
.modal strong{background:linear-gradient(transparent 60%,var(--peach) 60%)}
.modal ul{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:8px}
.modal li{background:#fff;border:2px solid var(--line);border-left:6px solid var(--lilac);border-radius:12px;padding:9px 14px}
.modal .btn{width:100%;margin-top:6px}
.modal-top{display:flex;justify-content:flex-end;margin:-4px 0 12px}
.lang-switch{display:inline-flex;border:2px solid var(--bg);border-radius:999px;overflow:hidden}
.lang-switch button{border:0;background:transparent;padding:7px 16px;min-height:40px;font-weight:700;font-size:15.5px;cursor:pointer;color:var(--ink)}
.lang-switch button[aria-pressed="true"]{background:var(--bg);color:var(--paper)}
.modal.wide{max-width:860px}
.pw-label{display:block;font-weight:700;margin:6px 0}
.pw-err{color:var(--bad);font-weight:700;margin:-6px 0 12px!important}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.modal .modal-actions .btn{width:auto;flex:1 1 140px;margin-top:0}
.asum{background:var(--paper-2);border-radius:12px;padding:10px 14px;margin:0 0 4px!important;display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:700}
.asec{font:700 20px var(--display);margin:18px 0 8px}
.alist{list-style:none;padding:0;margin:0 0 6px!important;display:grid;gap:8px}
.modal .alist li{border:2px solid var(--line);padding:10px 14px}
.arow{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px}
.atop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.arate{font:700 20px var(--display)}
.arate em{font:400 15px var(--body);color:var(--ink-soft);font-style:normal}
.abar{height:10px;border-radius:5px;background:var(--paper-2);margin:6px 0;overflow:hidden}
.abar div{height:100%;background:var(--bg);border-radius:5px}
.ameta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14.5px;color:var(--ink-soft)}
.saved-note{margin:6px 0 0;color:var(--ink-soft)}
.idline{margin:0 0 18px;font-size:15px;color:var(--ink-soft)}
.idline code{background:var(--paper-2);padding:2px 8px;border-radius:6px;font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.empty{background:var(--paper-2);border-radius:14px;padding:16px 18px;margin:0 0 20px}
.empty p{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 6px}
.tile{background:var(--paper-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:14.5px;color:var(--ink-soft)}
.tile b{font:700 26px/1.15 var(--display)}
.tile small{font-size:14px;color:var(--ink-soft)}
.sec-h{font:700 clamp(19px,4vw,22px)/1.2 var(--display);margin:24px 0 10px}
.prow{margin-bottom:14px}
.ptop{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin-bottom:5px}
.pbar{height:16px;border:2px solid var(--bg);border-radius:8px;overflow:hidden;background:#fff}
.pbar div{height:100%}
.pbar .f2{background:var(--lilac)}.pbar .f3{background:var(--peach)}.pbar .fd{background:var(--bg)}
.psub{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14.5px;color:var(--ink-soft);margin-top:4px}
.trend{display:flex;align-items:stretch;gap:6px;height:180px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 12px 8px}
.tcol{flex:1;max-width:52px;display:flex;flex-direction:column;align-items:center;min-width:0}
.tval{font-size:12.5px;font-weight:700;margin-bottom:2px}
.tbarwrap{flex:1;width:100%;display:flex;align-items:flex-end}
.tbar{width:100%;background:var(--bg);border-radius:6px 6px 0 0;min-height:3px}
.tlab{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.hist{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:10px}
.hitem{background:#fff;border:2px solid var(--line);border-radius:14px}
.hitem summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap}
.hitem summary::-webkit-details-marker,.arow summary::-webkit-details-marker{display:none}
.hd small{display:block;color:var(--ink-soft);font-size:14px}
.hs{font:700 20px var(--display)}
.hbody{padding:4px 14px 14px;border-top:1px solid var(--line)}
.hbody h4{font:700 17px var(--display);margin:12px 0 4px}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--paper-2);flex-wrap:wrap;font-size:16px}
.hrow .hr{font-weight:700}
.hrow.ok .hr{color:var(--good)}.hrow.no .hr{color:var(--bad)}
.sync{font-size:14.5px}.sync.ok{color:var(--good);font-weight:700}
.dash-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:0 0 14px}
.modal .dash-top .btn{width:auto;margin:0}
.arow summary{list-style:none;cursor:pointer;display:block}
.more{display:inline-block;transition:transform .15s}
details[open]>summary .more{transform:rotate(180deg)}
.dist{margin-top:10px;padding-top:10px;border-top:1px solid var(--paper-2);display:grid;gap:6px}

function randHex(n){
  let out='';
  try{const a=new Uint8Array(Math.ceil(n/2));crypto.getRandomValues(a);out=Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')}catch(e){}
  while(out.length<n)out+=Math.floor(Math.random()*16).toString(16);
  return out.slice(0,n);
}
let learnerId=null;
function getLearnerId(){
  if(learnerId)return learnerId;
  try{const v=localStorage.getItem('pp-learner-id');if(/^L-[a-f0-9]{16}$/.test(v||''))learnerId=v}catch(e){}
  if(!learnerId){
    learnerId='L-'+randHex(16);
    try{localStorage.setItem('pp-learner-id',learnerId)}catch(e){}
  }
  return learnerId;
}

function buildAttempt(){
  const a2=Q2.map((q,i)=>{const sel=state.s2.ans[i].sel;return{qid:'q2-'+i,section:2,q:q.s,resp:q.opts[sel],correct:q.opts[q.a],ok:sel===q.a,rule:q.r+1}});
  const a3=Q3.map((q,i)=>{const v=state.s3.ans[i].val.trim();return{qid:'q3-'+i,section:3,q:q.w,resp:v,correct:q.a,ok:norm(v)===q.a,rule:q.r+1}});
  const s2=a2.filter(x=>x.ok).length,s3=a3.filter(x=>x.ok).length;
  return{
    id:'A-'+randHex(16),learnerId:getLearnerId(),ts:new Date().toISOString(),lang:state.lang,
    s2:{score:s2,total:a2.length},s3:{score:s3,total:a3.length},
    overall:{score:s2+s3,total:a2.length+a3.length},
    answers:a2.concat(a3),synced:false
  };
}
function saveCurrentAttempt(){
  if(state.attemptSaved)return;
  state.attemptSaved=true;
  const list=loadAttempts();
  list.push(buildAttempt());
  while(list.length>200)list.shift();
  saveAttempts();
  syncPending();
}
async function postToSheet(body){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),20000);
  try{
    const r=await fetch(SHEETS_WEB_APP_URL.trim(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctrl.signal});
    return await r.json();
  }finally{clearTimeout(timer)}
}
let syncing=false;
async function syncPending(){
  if(!SHEETS_ON||syncing)return;
  const todo=loadAttempts().filter(a=>!a.synced);
  if(!todo.length)return;
  syncing=true;
  try{
    for(const a of todo){
      const res=await postToSheet({action:'submit',attempt:{
        attemptId:a.id,learnerId:a.learnerId,ts:a.ts,lang:a.lang,s2:a.s2,s3:a.s3,
        answers:a.answers.map(x=>({qid:x.qid,q:x.q,resp:x.resp,correct:x.correct,ok:x.ok,rule:x.rule}))
      }});
      if(res&&res.ok){a.synced=true;saveAttempts()}else break;
    }
  }catch(e){}
  syncing=false;
  document.querySelectorAll('[data-sync]').forEach(el=>{
    const a=loadAttempts().find(x=>x.id===el.dataset.sync);
    if(a&&a.synced){el.textContent=t().progShared;el.classList.add('ok')}
  });
}

async function loadDashboard(){
  const A=state.admin;
  if(!SHEETS_ON||A.source==='local'){
    A.req++;A.source='local';A.status='ok';A.data=localData();
    render(A.authed?'admin-close':null);return;
  }
  A.source='class';A.status='loading';
  const my=++A.req;
  render('admin-close');
  try{
    const res=await postToSheet({action:'stats',key:A.key});
    if(my!==A.req)return;
    if(res&&res.ok){A.data=sheetData(res);A.status='ok';A.error=''}
    else{A.status='error';A.error=(res&&res.error==='unauthorized')?'auth':'server'}
  }catch(e){
    if(my!==A.req)return;
    A.status='error';A.error='net';
  }
  if(state.admin.open&&state.admin.authed)render('admin-close');
}

  if(R.tip)h+='<div class="note"><span aria-hidden="true">💡</span><p>'+esc(R.tip)+'</p></div>';
  return h+'</article>';
}

/* ---------- section 2 ---------- */
function s2Correct(i){return state.s2.ans[i].sel===Q2[i].a}
function s2View(){
  const L=t(),S=state.s2;
  if(S.done)return s2Overview();
  const i=S.i,q=Q2[i],a=S.ans[i],checked=a.checked;
  const prog=S.ans.map((x,k)=>({checked:x.checked,okFlag:x.sel===Q2[k].a}));
  const opts=q.opts.map((o,k)=>{
    let cls='opt',glyph=LETTERS[k],tag='';
    if(checked){
      if(k===q.a){cls+=' right';glyph='✓';tag=L.correctAnswer}
      else if(k===a.sel){cls+=' wrong';glyph='✕';tag=L.yourAnswer}
      else cls+=' dim';
    }
    return '<button class="'+cls+'" role="radio" aria-checked="'+(a.sel===k)+'" data-action="opt" data-i="'+k+'" data-fid="opt-'+k+'"'+(checked?' disabled':'')+'><span class="k" aria-hidden="true">'+glyph+'</span><span>'+esc(o)+'</span>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</button>';
  }).join('');
  return '<h2 tabindex="-1" data-fid="panel-h">'+L.s2Title+'</h2><p class="lede">'+L.s2Lede+'</p>'+
    progressHtml(prog,i)+
    '<div class="opts" role="radiogroup" aria-label="'+esc(L.s2Title)+'">'+opts+'</div>'+
    (checked?feedbackHtml({ok:a.sel===q.a,ans:q.opts[q.a],sing:q.s,r:q.r,note:q.note}):'')+
    navHtml(2,i,Q2.length,checked,a.sel!==null,'finish2');
}
function s2Overview(){
  const L=t(),S=state.s2;
  const c=Q2.filter((q,i)=>s2Correct(i)).length;
  const items=Q2.map((q,i)=>{
    const a=S.ans[i],ok=s2Correct(i);
    const opts=q.opts.map((o,k)=>{
      let cls='ov-opt',tag='';
      if(k===q.a){cls+=' right';tag=(a.sel===k?L.yourAnswer+' ✓':L.correctAnswer+' ✓')}
      else if(k===a.sel){cls+=' wrong';tag=L.yourAnswer+' ✕'}
      return '<div class="'+cls+'"><span>'+LETTERS[k]+'. '+esc(o)+'</span>'+(tag?'<small>'+tag+'</small>':'')+'</div>';
    }).join('');
    return '<li class="ov-item '+(ok?'ok':'no')+'"><div class="ov-head"><span>'+fmt(L.question,{n:i+1})+'</span><span class="badge '+(ok?'ok':'no')+'">'+(ok?'✓ '+L.badgeOk:'✕ '+L.badgeNo)+'</span></div>'+
      '<div class="ov-opts">'+opts+'</div>'+
      (ok?'':'<p class="ov-line">'+L.correctAnswer+': <b>'+esc(q.opts[q.a])+'</b></p>')+
      ruleLine(q.r)+'</li>';
  }).join('');
  return '<h2 tabindex="-1" data-fid="panel-h">'+L.s2Overview+'</h2><p class="score">'+fmt(L.score,{c:c,t:Q2.length})+'</p>'+
    '<ul class="ov-list">'+items+'</ul>'+
    '<div class="actions"><button class="btn btn-cta" data-action="start3" data-fid="start3">'+L.startS3+'</button></div>';
}

/* ---------- section 3 ---------- */
function s3Correct(i){const a=state.s3.ans[i];return norm(a.val)===Q3[i].a}
function s3View(){
  const L=t(),S=state.s3;
  if(S.done)return s3Overview();
  const i=S.i,q=Q3[i],a=S.ans[i],checked=a.checked,ok=s3Correct(i);
  const prog=S.ans.map((x,k)=>({checked:x.checked,okFlag:s3Correct(k)}));
  return '<h2 tabindex="-1" data-fid="panel-h">'+L.s3Title+'</h2><p class="lede">'+L.s3Lede+'</p>'+
    progressHtml(prog,i)+
    '<div class="ask"><div class="stage"><span class="stage-label">'+L.typeLabel+'</span><div class="stage-row"><span class="word">'+esc(q.w)+'</span>'+ARROW+'<span class="word" aria-hidden="true">?</span></div></div></div>'+
    '<label class="sr" for="ans">'+L.typeLabel+': '+esc(q.w)+'</label>'+
    '<input id="ans" class="ans'+(checked?(ok?' ok':' no'):'')+'" data-fid="ans" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="40" enterkeyhint="done" placeholder="'+esc(L.placeholder)+'" value="'+esc(a.val)+'"'+(checked?' readonly':'')+'>'+
    (checked?feedbackHtml({ok:ok,ans:q.a,sing:q.w,r:q.r,note:q.note}):'')+
    navHtml(3,i,Q3.length,checked,a.val.trim().length>0,'finish3');
}
function s3Overview(){
  const L=t(),S=state.s3;
  const c=Q3.filter((q,i)=>s3Correct(i)).length;
  const items=Q3.map((q,i)=>{
    const a=S.ans[i],ok=s3Correct(i);
    return '<li class="ov-item '+(ok?'ok':'no')+'"><div class="ov-head"><span>'+esc(q.w)+'</span><span class="badge '+(ok?'ok':'no')+'">'+(ok?'✓ '+L.badgeOk:'✕ '+L.badgeNo)+'</span></div>'+
      '<p class="ov-line">'+L.yourAnswer+': <b>'+esc(a.val.trim()||'—')+'</b></p>'+
      (ok?'':'<p class="ov-line">'+L.correctAnswer+': <b>'+esc(q.a)+'</b></p>')+
      ruleLine(q.r)+'</li>';
  }).join('');
  return '<h2 tabindex="-1" data-fid="panel-h">'+L.s3Overview+'</h2><p class="score">'+fmt(L.score,{c:c,t:Q3.length})+'</p><p class="saved-note">'+(SHEETS_ON?L.savedShared:L.savedLocal)+'</p>'+
    '<ul class="ov-list">'+items+'</ul>'+
    '<div class="actions"><button class="btn btn-cta" data-action="show-result" data-fid="show-result">'+L.showResult+'</button></div>';
}

/* ---------- results ---------- */
function resView(){
  const L=t();
  const tot=Array(7).fill(0),c2r=Array(7).fill(0),c3r=Array(7).fill(0);
  let c2=0,c3=0;
  Q2.forEach((q,i)=>{tot[q.r]++;if(s2Correct(i)){c2r[q.r]++;c2++}});
  Q3.forEach((q,i)=>{tot[q.r]++;if(s3Correct(i)){c3r[q.r]++;c3++}});
  const cor=tot.map((n,r)=>c2r[r]+c3r[r]);
  const max=Math.max.apply(null,tot);
  const all=Q2.length+Q3.length,allC=c2+c3;
  const rows=tot.map((n,r)=>{
    let segs='';
    for(let k=0;k<n;k++)segs+='<span class="cseg '+(k<c2r[r]?'s2':(k<cor[r]?'s3':'s0'))+'"></span>';
    const label=fmt(L.ruleShort,{n:r+1,s:L.rules[r].short});
    return '<div class="crow" role="group" aria-label="'+esc(label+': '+fmt(L.ofTxt,{c:cor[r],t:n}))+'">'+
      '<div class="clabel"><b>'+fmt(L.ruleNum,{n:r+1})+'</b><span>'+esc(L.rules[r].short)+'</span></div>'+
      '<div class="ctrack"><div class="cbar" style="width:'+(n/max*100)+'%">'+segs+'</div></div>'+
      '<span class="ctotal">'+n+'</span></div>';
  }).join('');
  const weak=tot.map((n,r)=>({r:r,n:n,c:cor[r],acc:cor[r]/n})).filter(x=>x.c<x.n).sort((a,b)=>a.acc-b.acc||a.r-b.r);
  const weakHtml=weak.length?
    '<ul class="weak">'+weak.map(w=>'<li class="weak-item"><div><b>'+esc(fmt(L.ruleShort,{n:w.r+1,s:L.rules[w.r].short}))+'</b><span>'+fmt(L.ofTxt,{c:w.c,t:w.n})+'</span></div><button class="btn btn-ghost btn-sm" data-action="review" data-i="'+w.r+'" data-fid="review-'+w.r+'">'+L.review+'</button></li>').join('')+'</ul>':
    '<p class="perfect">'+L.weakNone+'</p>';
  return '<h2 tabindex="-1" data-fid="panel-h">'+L.resTitle+'</h2>'+
    '<p class="score">'+fmt(L.score,{c:allC,t:all})+'</p>'+
    '<div class="chips"><span class="chip">'+fmt(L.sectionScore,{n:2,c:c2,t:Q2.length})+'</span><span class="chip">'+fmt(L.sectionScore,{n:3,c:c3,t:Q3.length})+'</span></div>'+
    '<div class="chart"><h3>'+L.chartTitle+'</h3><div class="legend"><span><i style="background:var(--lilac)"></i>'+L.tabs[1]+'</span><span><i style="background:var(--peach)"></i>'+L.tabs[2]+'</span><span><i style="background:#fff"></i>'+L.badgeNo+'</span></div>'+rows+'<p class="cnote">'+L.chartNote+'</p></div>'+
    '<h3 class="weak-title">'+L.weakTitle+'</h3>'+weakHtml+
    '<div class="actions"><button class="btn btn-cta" data-action="progress" data-fid="progress">'+L.seeProgress+'</button><button class="btn btn-ghost" data-action="restart" data-fid="restart">'+L.startOver+'</button></div>';
}

/* ---------- stats (shared by My Progress and the Teacher Dashboard) ---------- */
function fmtDate(ts){
  try{return new Date(ts).toLocaleString(state.lang==='zh'?'zh-TW':'en-US',{dateStyle:'medium',timeStyle:'short'})}
  catch(e){return String(ts)}
}
function tile(label,value,sub){return '<div class="tile"><span>'+label+'</span><b>'+value+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div>'}
function pRow(label,c,n,cls,subHtml){
  const L=t(),p=n?Math.round(c/n*100):0;
  return '<div class="prow"><div class="ptop"><span>'+esc(label)+'</span><b>'+(n?p+'%':L.adminNoData)+'</b></div><div class="pbar" aria-hidden="true"><div class="'+cls+'" style="width:'+p+'%"></div></div>'+
    '<div class="psub">'+(subHtml||(n?'<span>'+fmt(L.adminAnswers,{c:c,t:n})+'</span>':''))+'</div></div>';
}
function qDef(qid){
  const m=/^q([23])-(\d+)$/.exec(qid);if(!m)return null;
  const sec=+m[1],idx=+m[2],item=(sec===2?Q2:Q3)[idx];if(!item)return null;
  const correct=sec===2?item.opts[item.a]:item.a;
  return{sec:sec,idx:idx,rule:item.r,correct:correct,options:sec===2?item.opts:null,prompt:(sec===2?item.s:item.w)+' → '+correct};
}
function localData(){
  const at=loadAttempts(),answers=[];
  at.forEach(a=>a.answers.forEach(x=>answers.push({aid:a.id,qid:x.qid,resp:String(x.resp),ok:!!x.ok})));
  return{attempts:at.map(a=>({id:a.id,learnerId:a.learnerId,ts:a.ts,s2:a.s2,s3:a.s3})),answers:answers,generatedAt:null};
}
function sheetData(res){
  return{
    attempts:(res.attempts||[]).map(r=>({id:String(r[0]),learnerId:String(r[1]),ts:String(r[2]),s2:{score:+r[4],total:+r[5]},s3:{score:+r[6],total:+r[7]}})),
    answers:(res.answers||[]).map(r=>({aid:String(r[0]),qid:String(r[1]),resp:String(r[2]),ok:+r[3]===1})),
    generatedAt:res.generatedAt||null
  };
}
function buildStats(D){
  const att=D.attempts,perL={};
  att.forEach(a=>{perL[a.learnerId]=(perL[a.learnerId]||0)+1});
  const ids=Object.keys(perL);
  const sec={2:{c:0,t:0},3:{c:0,t:0}};let sum=0;
  att.forEach(a=>{
    sec[2].c+=a.s2.score;sec[2].t+=a.s2.total;sec[3].c+=a.s3.score;sec[3].t+=a.s3.total;
    const tt=a.s2.total+a.s3.total;sum+=tt?(a.s2.score+a.s3.score)/tt:0;
  });
  const raw={};
  D.answers.forEach(x=>{
    if(!qDef(x.qid))return;
    const o=raw[x.qid]||(raw[x.qid]={n:0,c:0,resp:{}});
    o.n++;if(x.ok)o.c++;
    const k=norm(x.resp),r=o.resp[k]||(o.resp[k]={label:x.resp,n:0});r.n++;
  });
  const rules=Array.from({length:7},()=>({c:0,n:0})),questions=[],wrong=[];
  [2,3].forEach(k=>{
    for(let i=0;i<10;i++){
      const qid='q'+k+'-'+i,def=qDef(qid);if(!def)continue;
      const o=raw[qid]||{n:0,c:0,resp:{}},good=norm(def.correct);
      rules[def.rule].n+=o.n;rules[def.rule].c+=o.c;
      let dist,other=0,otherKinds=0;
      const entries=Object.keys(o.resp).map(key=>({label:o.resp[key].label,n:o.resp[key].n,ok:key===good})).sort((a,b)=>b.n-a.n);
      entries.forEach(e=>{if(!e.ok)wrong.push({def:def,label:e.label,n:e.n})});
      if(def.options)dist=def.options.map(op=>({label:op,n:(o.resp[norm(op)]||{n:0}).n,ok:norm(op)===good}));
      else{
        dist=entries.slice(0,8);
        entries.slice(8).forEach(e=>{other+=e.n;otherKinds++});
      }
      questions.push({def:def,n:o.n,c:o.c,dist:dist,other:other,otherKinds:otherKinds});
    }
  });
  wrong.sort((a,b)=>b.n-a.n);
  return{nAtt:att.length,nLearners:ids.length,repeat:ids.filter(k=>perL[k]>1).length,avg:att.length?sum/att.length:0,sec:sec,rules:rules,questions:questions,wrong:wrong.slice(0,10)};
}

/* ---------- My Progress page ---------- */
function pctOf(a){return a.overall&&a.overall.total?a.overall.score/a.overall.total:0}
function histItem(a,num){
  const L=t(),pc=Math.round(pctOf(a)*100);
  const rows=k=>a.answers.filter(x=>x.section===k).map(x=>
    '<div class="hrow '+(x.ok?'ok':'no')+'"><span><b>Q'+(+x.qid.split('-')[1]+1)+'</b> '+esc(x.q)+' → '+esc(x.correct)+'</span>'+
    '<span class="hr"><span class="sr">'+L.yourAnswer+': </span>'+(x.ok?'✓ ':'✕ ')+esc(x.resp)+'</span></div>').join('');
  return '<li><details class="hitem"><summary><span class="hd">'+esc(fmtDate(a.ts))+'<small>'+fmt(L.progAttemptN,{n:num})+'</small></span>'+
    '<span class="hs">'+a.overall.score+' / '+a.overall.total+' ('+pc+'%)</span></summary>'+
    '<div class="hbody"><h4>'+L.tabs[1]+': '+a.s2.score+' / '+a.s2.total+'</h4>'+rows(2)+
    '<h4>'+L.tabs[2]+': '+a.s3.score+' / '+a.s3.total+'</h4>'+rows(3)+
    (SHEETS_ON?'<p class="saved-note"><span class="sync'+(a.synced?' ok':'')+'" data-sync="'+esc(a.id)+'">'+(a.synced?L.progShared:L.progPending)+'</span></p>':'')+
    '</div></details></li>';
}
function progressView(){
  const L=t(),all=loadAttempts(),n=all.length;
  let h='<h2 tabindex="-1" data-fid="panel-h">'+L.progTitle+'</h2><p class="lede">'+L.progLede+'</p>'+
    '<p class="idline">'+L.progId+': <code>'+esc(getLearnerId())+'</code></p>';
  if(!n)h+='<div class="empty"><p>'+L.progEmpty+'</p></div>';
  else{
    const latest=all[n-1];
    let best=all[0];all.forEach(a=>{if(pctOf(a)>=pctOf(best))best=a});
    const sc=a=>a.overall.score+' / '+a.overall.total;
    h+='<div class="tiles">'+tile(L.progAttempts,String(n))+
      tile(L.progLatest,sc(latest),Math.round(pctOf(latest)*100)+'%')+
      tile(L.progBest,sc(best),Math.round(pctOf(best)*100)+'%')+'</div>';
    h+='<h3 class="sec-h">'+L.progBySection+'</h3>';
    [2,3].forEach(k=>{
      const key='s'+k;let c=0,tt=0,bs=0;
      all.forEach(a=>{c+=a[key].score;tt+=a[key].total;bs=Math.max(bs,a[key].score)});
      const lt=latest[key];
      h+=pRow(L.tabs[k-1],c,tt,k===2?'f2':'f3','<span>'+fmt(L.progLatestShort,{c:lt.score,t:lt.total})+'</span><span>'+fmt(L.progBestShort,{c:bs,t:lt.total})+'</span>');
    });
    const last=all.slice(-12),off=n-last.length;
    h+='<h3 class="sec-h">'+L.progTrend+'</h3><p class="lede" style="margin-bottom:10px">'+L.progTrendNote+'</p>'+
      '<div class="trend" role="img" aria-label="'+esc(last.map((a,i)=>(off+i+1)+': '+Math.round(pctOf(a)*100)+'%').join(', '))+'">'+
      last.map((a,i)=>{const pc=Math.round(pctOf(a)*100);return '<div class="tcol"><span class="tval">'+pc+'%</span><div class="tbarwrap"><div class="tbar" style="height:'+pc+'%"></div></div><span class="tlab">'+(off+i+1)+'</span></div>'}).join('')+'</div>';
    h+='<h3 class="sec-h">'+L.progHistory+'</h3><ul class="hist">'+all.map((a,i)=>histItem(a,i+1)).reverse().join('')+'</ul>';
  }
  h+='<div class="note"><span aria-hidden="true">🔒</span><p>'+(SHEETS_ON?L.progPrivacyOn:L.progPrivacyOff)+'</p></div>'+
    '<div class="actions"><button class="btn btn-ghost" data-action="progress-back" data-fid="progress-back">'+L.progBack+'</button></div>';
  return h;
}

/* ---------- render ---------- */
function panelHtml(){
  switch(state.tab){
    case 's2':return s2View();
    case 's3':return s3View();
    case 'res':return resView();
    case 'progress':return progressView();
    default:return s1View();
  }
}
function render(focus){
  const active=document.activeElement;
  const fid=focus===undefined?(active&&active.dataset?active.dataset.fid:null):focus;
  document.documentElement.lang=state.lang==='zh'?'zh-Hant':'en';
  app.innerHTML=headerHtml()+
    '<main'+(isModal()?' inert':'')+'><nav class="tabs" aria-label="Sections">'+tabsHtml()+'</nav><section class="panel" id="panel">'+panelHtml()+'</section></main>'+
    modalHtml();
  state.animIn=false;
  document.body.style.overflow=isModal()?'hidden':'';
  if(fid){
    const el=app.querySelector('[data-fid="'+fid+'"]');
    if(el&&!el.disabled){
      el.focus({preventScroll:true});
      if(el.tagName==='INPUT'&&!el.readOnly){const n=el.value.length;el.setSelectionRange(n,n)}
    }
  }
}
function go(focus){
  render(focus);
  const tabs=app.querySelector('.tabs');
  if(tabs&&tabs.getBoundingClientRect().top<0)tabs.scrollIntoView({block:'start'});
}

/* ---------- actions ---------- */
function closeIntro(){
  const back=state.introFrom==='about'?'menu-btn':'panel-h';
  state.introOpen=false;state.introFrom='start';
  render(back);
}
function act(name,el){
  const L=t();
  switch(name){
    case 'menu':
      state.menuOpen=!state.menuOpen;state.langOpen=false;render('menu-btn');break;
    case 'lang-toggle':
      state.langOpen=!state.langOpen;render('mi-lang');break;
    case 'set-lang':
      state.lang=el.dataset.lang;
      try{localStorage.setItem('pp-lang',state.lang)}catch(e){}
      state.menuOpen=false;state.langOpen=false;render(state.introOpen?'intro-'+state.lang:'menu-btn');break;
    case 'about':
      state.menuOpen=false;state.langOpen=false;state.introOpen=true;state.animIn=true;state.introFrom='about';render('gotit');break;
    case 'admin':
      state.menuOpen=false;state.langOpen=false;state.admin.open=true;state.admin.err=false;state.animIn=true;
      if(state.admin.authed)loadDashboard();else render('pw');
      break;
    case 'admin-login':{
      const inp=document.getElementById('pw');
      if(inp&&inp.value===ADMIN_PW){
        state.admin.authed=true;state.admin.err=false;state.admin.key=inp.value;
        state.admin.source=SHEETS_ON?'class':'local';
        loadDashboard();
      }else{state.admin.err=true;render('pw')}
      break;
    }
    case 'admin-source':
      if(el.dataset.src==='class'){state.admin.source='class';loadDashboard()}
      else{state.admin.req++;state.admin.source='local';state.admin.status='ok';state.admin.data=localData();render('src-local')}
      break;
    case 'admin-refresh':loadDashboard();break;
    case 'progress':
      state.menuOpen=false;state.langOpen=false;
      if(state.tab!=='progress')state.prevTab=state.tab;
      state.tab='progress';go('panel-h');break;
    case 'progress-back':state.tab=state.prevTab||'s1';go('panel-h');break;
    case 'admin-close':state.admin.open=false;render('menu-btn');break;
    case 'admin-logout':state.admin.authed=false;state.admin.open=false;render('menu-btn');break;
    case 'close-intro':closeIntro();break;
    case 'tab':{
      const k=el.dataset.tab;
      if(k!=='s1'&&!state.unlocked[k]){toast(L.lock[k]);return}
      state.tab=k;go('tab-'+k);break;
    }
    case 'rule':{
      const i=+el.dataset.i;state.s1.rule=i;state.s1.seen[i]=true;render('rule-'+i);break;
    }
    case 'finish-learning':
      state.unlocked.s2=true;state.tab='s2';go('panel-h');break;

    case 'opt':{
      const a=state.s2.ans[state.s2.i];
      if(a.checked)return;
      a.sel=+el.dataset.i;render('opt-'+a.sel);break;
    }
    case 'check2':{
      const i=state.s2.i,a=state.s2.ans[i];
      if(a.sel===null||a.checked)return;
      a.checked=true;
      live((s2Correct(i)?L.correct:L.wrong)+' '+fmt(L.correctIs,{w:Q2[i].opts[Q2[i].a]}));
      render('next2');break;
    }
    case 'prev2':if(state.s2.i>0){state.s2.i--;go('panel-h')}break;
    case 'next2':if(state.s2.i<Q2.length-1&&state.s2.ans[state.s2.i].checked){state.s2.i++;go('panel-h')}break;
    case 'finish2':state.s2.done=true;go('panel-h');break;
    case 'start3':state.unlocked.s3=true;state.tab='s3';go('panel-h');break;

    case 'check3':{
      const i=state.s3.i,a=state.s3.ans[i];
      if(a.checked||!a.val.trim())return;
      a.checked=true;
      live((s3Correct(i)?L.correct:L.wrong)+' '+fmt(L.correctIs,{w:Q3[i].a}));
      render('next3');break;
    }
    case 'prev3':if(state.s3.i>0){state.s3.i--;go('panel-h')}break;
    case 'next3':if(state.s3.i<Q3.length-1&&state.s3.ans[state.s3.i].checked){state.s3.i++;go('ans')}break;
    case 'finish3':state.s3.done=true;saveCurrentAttempt();go('panel-h');break;
    case 'show-result':state.unlocked.res=true;state.tab='res';go('panel-h');break;

    case 'review':{
      const r=+el.dataset.i;state.tab='s1';state.s1.rule=r;state.s1.seen[r]=true;go('panel-h');break;
    }
    case 'restart':{
      state=fresh(state.lang,false);go('panel-h');break;
    }
  }
}

document.addEventListener('click',function(e){
  const btn=e.target.closest('[data-action]');
  if(state.menuOpen&&!e.target.closest('.menu-wrap')){
    state.menuOpen=false;state.langOpen=false;
    if(!btn){render(null);return}
  }
  if(btn)act(btn.dataset.action,btn);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(state.admin.open){state.admin.open=false;render('menu-btn')}
    else if(state.introOpen)closeIntro();
    else if(state.menuOpen){state.menuOpen=false;state.langOpen=false;render('menu-btn')}
  }
  if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();act('check3',e.target)}
  if(e.key==='Enter'&&e.target.id==='pw'){e.preventDefault();act('admin-login',e.target)}
});
document.addEventListener('input',function(e){
  if(e.target.id==='ans'){
    state.s3.ans[state.s3.i].val=e.target.value;
    const b=app.querySelector('[data-action="check3"]');
    if(b)b.disabled=!e.target.value.trim();
  }
});

getLearnerId();
setTimeout(syncPending,1500);
render('gotit');
})();
</script>
